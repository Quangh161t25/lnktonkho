<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sanphamkho</title>
</head>
<body>
    <script>
        window.location.replace('index.html?module=sanphamkho');
    </script>
    <template data-module-fragment="sanphamkho">
<div id="module-sanphamkho" class="hidden h-full flex flex-col">
                    <div
                        class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between gap-4 shrink-0">
                        <input id="sanphamkhoSearchInput" oninput="renderSimpleSheetModule('sanphamkho', true)"
                            placeholder="Tìm sản phẩm theo kho..." class="hidden">
                        <span id="sanphamkhoCount" class="text-xs text-slate-500 whitespace-nowrap">0 bản ghi</span>
                        <div class="flex items-center gap-2">
                            <button id="btnWarehouseProductManual" onclick="openWarehouseProductDrawer()"
                                class="px-3 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold hover:bg-blue-700 transition">
                                Thêm = tay
                            </button>
                            <button id="btnWarehouseProductExcel" onclick="triggerSimpleSheetExcelUpload('sanphamkho')"
                                class="px-3 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700 transition">
                                Thêm = Excel
                            </button>
                            <button id="btnWarehouseProductTemplate" onclick="downloadSimpleSheetTemplate('sanphamkho')"
                                class="px-3 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold hover:bg-emerald-700 transition">
                                Tải Excel mẫu
                            </button>
                            <button onclick="downloadFilteredSimpleSheetExcel('sanphamkho')"
                                class="px-3 py-2 bg-slate-700 text-white rounded-lg text-xs font-bold hover:bg-slate-800 transition">
                                Tải Excel theo lọc
                            </button>
                        </div>
                    </div>
                    <div class="bg-white border-b border-slate-200 px-6 py-3 flex items-center gap-2 shrink-0">
                        <select id="sanphamkhoFilterKho" onchange="renderSimpleSheetModule('sanphamkho', true)"
                            class="px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white min-w-[110px]"><option value="">Tất cả kho</option></select>
                        <input id="sanphamkhoFilterIdSp" list="sanphamkhoProductList"
                            oninput="renderSimpleSheetModule('sanphamkho', true)"
                            placeholder="Lọc ID SP..."
                            class="px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white min-w-[260px]">
                        <datalist id="sanphamkhoProductList"></datalist>
                    </div>
                    <div class="flex-1 min-h-0 overflow-hidden p-6 flex flex-col">
                        <div
                            class="hidden md:block flex-1 min-h-0 bg-white border border-slate-200 rounded-xl shadow-sm overflow-auto">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                                    <tr>
                                        <th data-sort-module="sanphamkho" data-sort-column="kho" onclick="toggleSimpleModuleSort('sanphamkho', 'kho')" class="cursor-pointer select-none">Kho <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanphamkho" data-sort-column="id_sp" onclick="toggleSimpleModuleSort('sanphamkho', 'id_sp')" class="cursor-pointer select-none">ID SP <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanphamkho" data-sort-column="ten_sp" onclick="toggleSimpleModuleSort('sanphamkho', 'ten_sp')" class="cursor-pointer select-none">Tên SP <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanphamkho" data-sort-column="ton_dau" onclick="toggleSimpleModuleSort('sanphamkho', 'ton_dau')" class="text-right cursor-pointer select-none">Tồn đầu <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanphamkho" data-sort-column="nhap" onclick="toggleSimpleModuleSort('sanphamkho', 'nhap')" class="text-right cursor-pointer select-none">Nhập <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanphamkho" data-sort-column="xuat" onclick="toggleSimpleModuleSort('sanphamkho', 'xuat')" class="text-right cursor-pointer select-none">Xuất <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanphamkho" data-sort-column="nhap_ck" onclick="toggleSimpleModuleSort('sanphamkho', 'nhap_ck')" class="text-right cursor-pointer select-none">Nhập CK <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanphamkho" data-sort-column="xuat_ck" onclick="toggleSimpleModuleSort('sanphamkho', 'xuat_ck')" class="text-right cursor-pointer select-none">Xuất CK <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanphamkho" data-sort-column="ton_cuoi" onclick="toggleSimpleModuleSort('sanphamkho', 'ton_cuoi')" class="text-right cursor-pointer select-none">Tồn cuối <span data-sort-indicator></span></th>
                                    </tr>
                                </thead>
                                <tbody id="sanphamkhoTableBody"></tbody>
                            </table>
                        </div>
                        <div id="sanphamkhoMobileCards" class="md:hidden flex-1 min-h-0 overflow-auto space-y-3"></div>
                        <div id="sanphamkhoPagination"></div>
                    </div>
                </div>
    </template>
</body>
</html>
