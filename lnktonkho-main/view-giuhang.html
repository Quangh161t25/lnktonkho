<div id="module-giuhang" class="hidden h-full flex flex-col">
                    <!-- Filter bar -->
                    <div
                        class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-4 shrink-0">
                        <div class="hidden">
                            <div class="relative flex-1 max-w-sm">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                    </svg>
                                </span>
                                <input type="text" id="giuHangSearchInput" oninput="applyGiuHangFilters()"
                                    placeholder="Tìm tên nhân viên, SP..."
                                    class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button id="btnAddGiuHang" onclick="openGHDrawer()"
                                class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-blue-700 transition shadow-md shadow-blue-200">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                </svg>
                                Thêm mới
                            </button>
                            <div class="h-6 w-px bg-slate-200 mx-1"></div>
                            <button onclick="renderGiuHangModule()"
                                class="p-2 text-slate-500 hover:bg-slate-100 rounded-lg transition"
                                title="Làm mới dữ liệu">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                            </button>
                            <div class="h-6 w-px bg-slate-200 mx-1"></div>
                            <button id="btnClearGiuHang" onclick="clearAllGiuHang()"
                                class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition"
                                title="Xóa toàn bộ dữ liệu">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                            <div class="h-6 w-px bg-slate-200 mx-1"></div>
                            <span id="giuHangCount"
                                class="text-xs font-medium text-slate-500 bg-slate-50 px-2.5 py-1 rounded-full border border-slate-100">0
                                bản ghi</span>
                        </div>
                    </div>

                    <div class="flex-1 overflow-auto p-6">
                        <!-- Desktop View: Table -->
                        <div
                            class="hidden md:block bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                                        <tr>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                                Tên Nhân Viên</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider text-center">
                                                Mã SP</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                                Tên Sản Phẩm</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">
                                                Số lượng</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider text-center">
                                                Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody id="giuHangTableBody" class="divide-y divide-slate-100">
                                        <tr>
                                            <td colspan="5" class="px-4 py-10 text-center text-slate-400">Đang tải...
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <!-- Mobile View: Cards -->
                        <div id="giuHangMobileCards" class="md:hidden space-y-3"></div>
                    </div>
                </div>
