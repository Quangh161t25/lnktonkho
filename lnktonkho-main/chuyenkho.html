<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chuyenkho</title>
</head>
<body>
    <script>
        window.location.replace('index.html?module=chuyenkho');
    </script>
    <template data-module-fragment="chuyenkho">
<div id="module-chuyenkho" class="hidden h-full flex flex-col">
                    <div class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between gap-4 shrink-0">
                        <input id="chuyenkhoSearchInput" oninput="renderSimpleSheetModule('chuyenkho', true)"
                            placeholder="Tìm trong CHUYEN_KHO_CT..." class="hidden">
                        <span id="chuyenkhoCount" class="text-xs text-slate-500 whitespace-nowrap">0 bản ghi</span>
                        <div class="ml-auto flex items-center gap-2">
                            <button onclick="openSimpleSheetManualDrawer('chuyenkho')" class="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold hover:bg-blue-700">Thêm = tay</button>
                            <button onclick="triggerSimpleSheetExcelUpload('chuyenkho')" class="px-3 py-2 rounded-lg bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700">Thêm = Excel</button>
                            <button onclick="downloadSimpleSheetTemplate('chuyenkho')" class="px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700">Tải Excel mẫu</button>
                            <button onclick="downloadFilteredSimpleSheetExcel('chuyenkho')" class="px-3 py-2 rounded-lg bg-slate-700 text-white text-xs font-bold hover:bg-slate-800">Tải Excel theo lọc</button>
                        </div>
                    </div>
                    <div class="bg-white border-b border-slate-200 px-6 py-3 flex flex-wrap items-center gap-2 shrink-0">
                        <input type="date" id="chuyenkhoDateFrom" onchange="renderSimpleSheetModule('chuyenkho', true)" class="px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white">
                        <span class="text-slate-400">→</span>
                        <input type="date" id="chuyenkhoDateTo" onchange="renderSimpleSheetModule('chuyenkho', true)" class="px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white">
                        <div class="flex items-center gap-1 p-1 bg-slate-100 rounded-lg">
                            <button onclick="setSimpleSheetQuickDate('chuyenkho', 'today')" class="px-3 py-1.5 text-[10px] font-bold rounded-md hover:bg-white">HÔM NAY</button>
                            <button onclick="setSimpleSheetQuickDate('chuyenkho', 'week')" class="px-3 py-1.5 text-[10px] font-bold rounded-md hover:bg-white">TUẦN NÀY</button>
                            <button onclick="setSimpleSheetQuickDate('chuyenkho', 'month')" class="px-3 py-1.5 text-[10px] font-bold rounded-md hover:bg-white">THÁNG NÀY</button>
                        </div>
                        <input id="chuyenkhoFilterMdh" oninput="renderSimpleSheetModule('chuyenkho', true)" placeholder="Lọc MDH..." class="px-3 py-2 border border-slate-200 rounded-lg text-xs min-w-[130px]">
                        <input id="chuyenkhoFilterIdSp" oninput="renderSimpleSheetModule('chuyenkho', true)" placeholder="Lọc ID SP..." class="px-3 py-2 border border-slate-200 rounded-lg text-xs min-w-[130px]">
                        <select id="chuyenkhoFilterKhoDi" onchange="renderSimpleSheetModule('chuyenkho', true)" class="px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white"><option value="">Tất cả kho đi</option><option>KHO 1</option><option>KHO 2</option><option>KHO 3</option><option>KHO 4</option><option>KHO 5</option></select>
                        <select id="chuyenkhoFilterKhoNhan" onchange="renderSimpleSheetModule('chuyenkho', true)" class="px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white"><option value="">Tất cả kho nhận</option><option>KHO 1</option><option>KHO 2</option><option>KHO 3</option><option>KHO 4</option><option>KHO 5</option></select>
                        <input id="chuyenkhoFilterCondition" oninput="renderSimpleSheetModule('chuyenkho', true)" placeholder="Lọc tình trạng..." class="px-3 py-2 border border-slate-200 rounded-lg text-xs min-w-[130px]">
                        <input id="chuyenkhoFilterStatus" oninput="renderSimpleSheetModule('chuyenkho', true)" placeholder="Lọc trạng thái..." class="px-3 py-2 border border-slate-200 rounded-lg text-xs min-w-[130px]">
                    </div>
                    <div class="flex-1 min-h-0 overflow-hidden p-6 flex flex-col">
                        <div class="hidden md:block flex-1 min-h-0 bg-white border border-slate-200 rounded-xl shadow-sm overflow-auto">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                                    <tr><th>Ngày</th><th>MDH</th><th>ID SP</th><th>Tên SP</th><th>SLG</th><th>Kho đi</th><th>Kho nhận</th><th>Ghi chú</th><th>Tình trạng</th><th>Trạng thái</th></tr>
                                </thead>
                                <tbody id="chuyenkhoTableBody"></tbody>
                            </table>
                        </div>
                        <div id="chuyenkhoMobileCards" class="md:hidden flex-1 min-h-0 overflow-auto space-y-3"></div>
                        <div id="chuyenkhoPagination"></div>
                    </div>
                </div>
    </template>
</body>
</html>
