<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dukien</title>
</head>
<body>
    <script>
        window.location.replace('index.html?module=dukien');
    </script>
    <template data-module-fragment="dukien">
<div id="module-dukien" class="hidden h-full flex flex-col">
            <div class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between gap-4 shrink-0">
                <input id="dukienSearchInput" oninput="renderSimpleSheetModule('dukien', true)"
                    placeholder="Tìm trong dự kiến hàng về..." class="hidden">
                <span id="dukienCount" class="text-xs text-slate-500 whitespace-nowrap">0 bản ghi</span>
                <div class="ml-auto flex items-center gap-2">
                    <button onclick="openExpectedManualDrawer()"
                        class="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold hover:bg-blue-700">Thêm = tay</button>
                    <button onclick="triggerSimpleSheetExcelUpload('dukien')"
                        class="px-3 py-2 rounded-lg bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700">Thêm = Excel</button>
                    <button onclick="downloadSimpleSheetTemplate('dukien')"
                        class="px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700">Tải Excel mẫu</button>
                    <button onclick="downloadFilteredSimpleSheetExcel('dukien')"
                        class="px-3 py-2 rounded-lg bg-slate-700 text-white text-xs font-bold hover:bg-slate-800">Tải Excel theo lọc</button>
                </div>
            </div>

            <div class="bg-white border-b border-slate-200 px-6 py-3 flex flex-wrap items-center gap-2 shrink-0">
                <input type="date" id="dukienDateFrom" onchange="renderSimpleSheetModule('dukien', true)"
                    class="px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white">
                <span class="text-slate-400">→</span>
                <input type="date" id="dukienDateTo" onchange="renderSimpleSheetModule('dukien', true)"
                    class="px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white">
                <div class="flex items-center gap-1 p-1 bg-slate-100 rounded-lg">
                    <button onclick="setSimpleSheetQuickDate('dukien', 'today')" class="px-3 py-1.5 text-[10px] font-bold rounded-md hover:bg-white">HÔM NAY</button>
                    <button onclick="setSimpleSheetQuickDate('dukien', 'week')" class="px-3 py-1.5 text-[10px] font-bold rounded-md hover:bg-white">TUẦN NÀY</button>
                    <button onclick="setSimpleSheetQuickDate('dukien', 'month')" class="px-3 py-1.5 text-[10px] font-bold rounded-md hover:bg-white">THÁNG NÀY</button>
                </div>
                <input id="dukienFilterMdh" oninput="renderSimpleSheetModule('dukien', true)"
                    placeholder="Lọc Mã PO..." class="px-3 py-2 border border-slate-200 rounded-lg text-xs min-w-[150px]">
                <input id="dukienFilterIdSp" oninput="renderSimpleSheetModule('dukien', true)"
                    placeholder="Lọc ID SP..." class="px-3 py-2 border border-slate-200 rounded-lg text-xs min-w-[150px]">
                <select id="dukienFilterStatus" onchange="renderSimpleSheetModule('dukien', true)"
                    class="px-3 py-2 border border-slate-200 rounded-lg text-xs bg-white min-w-[220px]">
                    <option value="">Tất cả trạng thái</option>
                    <option value="Chưa giao (Pending)">Chưa giao (Pending)</option>
                    <option value="Đang trên đường (In Transit)">Đang trên đường (In Transit)</option>
                    <option value="Đã về kho - Đang kiểm (Arrived - Checking)">Đã về kho - Đang kiểm (Arrived - Checking)</option>
                    <option value="Đã nhập kho xong (Completed)">Đã nhập kho xong (Completed)</option>
                    <option value="Bị hoãn (Delayed)">Bị hoãn (Delayed)</option>
                </select>
            </div>

            <div class="flex-1 min-h-0 overflow-hidden p-6 flex flex-col">
                <div class="hidden md:block flex-1 min-h-0 bg-white border border-slate-200 rounded-xl shadow-sm overflow-auto">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                            <tr>
                                <th>STT</th>
                                <th>Ngày nhập</th>
                                <th>Mã PO</th>
                                <th>ID SP</th>
                                <th>Tên SP</th>
                                <th>ĐVT</th>
                                <th class="text-right">SL dự kiến</th>
                                <th>Ngày về dự kiến</th>
                                <th>Trạng thái</th>
                                <th class="text-right">SL thực nhận</th>
                                <th class="text-right">Chênh lệch</th>
                                <th>Ghi chú</th>
                            </tr>
                        </thead>
                        <tbody id="dukienTableBody"></tbody>
                    </table>
                </div>
                <div id="dukienMobileCards" class="md:hidden flex-1 min-h-0 overflow-auto space-y-3"></div>
                <div id="dukienPagination"></div>
            </div>

            <div id="expectedManualDrawerOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] hidden"
                onclick="closeExpectedManualDrawer()"></div>
            <div id="expectedManualDrawer"
                class="fixed inset-y-0 right-0 w-full md:w-[calc(100vw-16rem)] bg-white shadow-2xl z-[101] translate-x-full transition-transform duration-300 flex flex-col">
                <div class="h-16 border-b border-slate-100 flex items-center justify-between px-6 shrink-0">
                    <h3 id="expectedManualDrawerTitle" class="font-bold text-slate-800">Thêm dự kiến hàng về</h3>
                    <button onclick="closeExpectedManualDrawer()" class="p-2 text-slate-400 hover:bg-slate-100 rounded-full">✕</button>
                </div>
                <div class="flex-1 overflow-y-auto p-6">
                    <datalist id="expectedProductList"></datalist>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <input id="expectedManualId" type="hidden">
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-500 uppercase">Ngày nhập</label>
                            <input id="expectedManualEntryDate" type="date" class="form-input">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-500 uppercase">Mã PO</label>
                            <input id="expectedManualPo" class="form-input" placeholder="Nhập mã PO...">
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-xs font-bold text-slate-500 uppercase">Ngày về dự kiến</label>
                            <input id="expectedManualArrivalDate" type="date" class="form-input">
                        </div>
                        <div class="space-y-1.5 md:col-span-2">
                            <label class="text-xs font-bold text-slate-500 uppercase">Trạng thái</label>
                            <select id="expectedManualStatus" class="form-input bg-white">
                                <option value="Chưa giao (Pending)">Chưa giao (Pending)</option>
                                <option value="Đang trên đường (In Transit)">Đang trên đường (In Transit)</option>
                                <option value="Đã về kho - Đang kiểm (Arrived - Checking)">Đã về kho - Đang kiểm (Arrived - Checking)</option>
                                <option value="Đã nhập kho xong (Completed)">Đã nhập kho xong (Completed)</option>
                                <option value="Bị hoãn (Delayed)">Bị hoãn (Delayed)</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-6">
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-xs font-bold text-slate-500 uppercase">Sản phẩm</label>
                            <button type="button" onclick="addExpectedProductRow()" class="px-3 py-2 rounded-lg bg-blue-50 text-blue-600 text-xs font-bold hover:bg-blue-100">+ Thêm dòng</button>
                        </div>
                        <div class="border border-slate-200 rounded-xl overflow-auto">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 border-b border-slate-200">
                                    <tr>
                                        <th>STT</th>
                                        <th>ID SP</th>
                                        <th>Tên SP</th>
                                        <th>ĐVT</th>
                                        <th class="text-right">SL dự kiến</th>
                                        <th class="text-right">SL thực nhận</th>
                                        <th class="text-right">Chênh lệch</th>
                                        <th>Ghi chú</th>
                                        <th>Xóa</th>
                                    </tr>
                                </thead>
                                <tbody id="expectedProductRows"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="p-6 border-t border-slate-100 bg-slate-50/50 flex gap-3">
                    <button onclick="closeExpectedManualDrawer()" class="flex-1 py-2.5 rounded-xl text-sm font-bold text-slate-500">Hủy bỏ</button>
                    <button id="expectedManualSaveBtn" onclick="saveExpectedManual()"
                        class="flex-[2] py-2.5 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700">Lưu dự kiến hàng về</button>
                </div>
            </div>
        </div>
    </template>
</body>
</html>
