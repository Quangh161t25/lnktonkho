<div id="module-nhapxuat" class="hidden h-full flex flex-col">
                    <!-- Filter bar -->
                    <div class="bg-gray-50 border-b border-gray-200 shrink-0">
                        <!-- Top Row: Title + Main Actions -->
                        <div class="px-6 py-3 flex items-center justify-between">
                            <h2 class="text-lg font-bold text-gray-800 tracking-tight">Nhập xuất chi tiết</h2>
                            <div class="flex items-center gap-3">
                                <!-- Hidden File Input for Excel Upload -->
                                <input type="file" id="excelUploadInput" accept=".xlsx, .xls, .csv" class="hidden"
                                    onchange="handleFileSelect(this)">

                                <button id="btnManualNX" onclick="openNXManualDrawer()"
                                    class="hidden flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-blue-700 shadow-sm transition">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                    </svg>
                                    <span>Thêm bằng tay</span>
                                </button>

                                <button id="btnDownloadNXTemplate" onclick="downloadNXUploadTemplate()"
                                    class="hidden flex items-center gap-2 bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-emerald-700 shadow-sm transition">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                    </svg>
                                    <span>Tải file mẫu</span>
                                </button>

                                <button id="btnUploadNhap" onclick="triggerUpload('NHẬP')"
                                    class="hidden flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-blue-700 shadow-sm transition">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v8" />
                                    </svg>
                                    <span>Tải lên NHẬP</span>
                                </button>
                                <button id="btnUploadXuat" onclick="triggerUpload('XUẤT')"
                                    class="hidden flex items-center gap-2 bg-orange-500 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-orange-600 shadow-sm transition">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v8" />
                                    </svg>
                                    <span>Tải lên XUẤT</span>
                                </button>

                                <button id="btnUploadTraLai" onclick="triggerUpload('HÀNG TRẢ LẠI')"
                                    class="hidden flex items-center gap-2 bg-pink-600 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-pink-700 shadow-sm transition">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v8" />
                                    </svg>
                                    <span>TẢI LÊN TRẢ LẠI MUA HÀNG</span>
                                </button>

                                <button id="btnUploadNhapTra" onclick="triggerUpload('NHẬP TRẢ')"
                                    class="hidden flex items-center gap-2 bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-semibold hover:bg-indigo-700 shadow-sm transition">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v8" />
                                    </svg>
                                    <span>TẢI LÊN TRẢ LẠI XUẤT HÀNG</span>
                                </button>

                                <div class="h-6 w-px bg-gray-300 mx-1"></div>
                                <span id="nxCount"
                                    class="text-xs font-medium text-gray-600 bg-white px-3 py-1.5 rounded-md border border-gray-200 shadow-sm">0
                                    đơn hàng</span>
                                <div class="h-6 w-px bg-gray-300 mx-1"></div>

                                <button onclick="renderNXModule()"
                                    class="p-2 text-gray-400 hover:text-gray-600 bg-white border border-gray-200 hover:bg-gray-50 rounded-lg shadow-sm transition"
                                    title="Làm mới dữ liệu">
                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                    </svg>
                                </button>

                                <button onclick="downloadNXExcel()"
                                    class="p-2 text-green-600 hover:text-green-700 bg-white border border-gray-200 hover:bg-gray-50 rounded-lg shadow-sm transition"
                                    title="Tải xuống Excel">
                                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Bottom Row: Filters -->
                        <div class="px-6 py-3 bg-white flex flex-wrap items-center gap-3 border-t border-gray-100">
                            <div class="hidden">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                    </svg>
                                </span>
                                <input type="text" id="nxSearchInput" list="nxOrderCustomerList"
                                    oninput="applyFilters(true)" placeholder="Lọc Mã đơn, Khách hàng..."
                                    class="w-full pl-9 pr-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition shadow-sm">
                                <datalist id="nxOrderCustomerList"></datalist>
                            </div>

                            <div class="flex-1 min-w-[150px] relative">
                                <input type="text" id="nxSearchProduct" list="nxProductList"
                                    oninput="applyFilters(true)" placeholder="Lọc Mã SP, Tên SP..."
                                    class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-sm">
                                <datalist id="nxProductList"></datalist>
                            </div>

                            <select id="nxTypeFilter" onchange="applyFilters(true)"
                                class="px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white transition shadow-sm w-36">
                                <option value="">Tất cả loại đơn</option>
                                <option value="NHẬP">NHẬP</option>
                                <option value="XUẤT">XUẤT</option>
                            </select>

                            <div
                                class="flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-gray-200 shadow-sm">
                                <span class="text-xs font-medium text-gray-500">Từ</span>
                                <input type="date" id="nxDateFrom" onchange="applyFilters(true)"
                                    class="bg-transparent border-none text-sm p-0 m-0 focus:ring-0 text-gray-700 w-[115px]">
                                <span class="text-xs font-medium text-gray-500 ml-2">Đến</span>
                                <input type="date" id="nxDateTo" onchange="applyFilters(true)"
                                    class="bg-transparent border-none text-sm p-0 m-0 focus:ring-0 text-gray-700 w-[115px]">
                            </div>

                            <div
                                class="ml-auto bg-green-50 border border-green-200 px-4 py-2 rounded-lg flex items-center gap-2 shadow-sm">
                                <span class="text-xs font-medium text-green-700 uppercase tracking-tight">Tổng:</span>
                                <span id="nxTotalAmount" class="text-base font-bold text-green-800">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex-1 overflow-auto p-6">
                        <!-- Desktop View: Table -->
                        <div
                            class="hidden md:block bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                                        <tr>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                                Ngày</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider text-center">
                                                Trường</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                                Mã đơn</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                                Khách hàng</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                                ID SP</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                                Tên SP</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">
                                                Số lượng</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">
                                                Đơn giá</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">
                                                Thành tiền</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                                Nhân viên</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                                Kho xác nhận</th>
                                            <th
                                                class="px-4 py-3 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">
                                                Thao tác</th>
                                        </tr>
                                    </thead>
                                    <tbody id="nxTableBody" class="divide-y divide-slate-100">
                                        <tr>
                                            <td colspan="12" class="px-4 py-10 text-center text-slate-400">Đang tải...
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <!-- Mobile View: Cards -->
                        <div id="nxMobileCards" class="md:hidden space-y-3">
                            <!-- Dynamic cards -->
                        </div>
                        <!-- Pagination -->
                        <div id="nxPagination" class="mt-2"></div>
                    </div>
                </div>
