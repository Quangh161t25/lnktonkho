<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sanpham</title>
</head>
<body>
    <script>
        window.location.replace('index.html?module=sanpham');
    </script>
    <template data-module-fragment="sanpham">
<div id="module-sanpham" class="hidden h-full flex flex-col">
                    <div
                        class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between gap-4 shrink-0">
                        <input id="sanphamSearchInput" oninput="renderSimpleSheetModule('sanpham', true)"
                            placeholder="Tìm sản phẩm..." class="hidden">
                        <span id="sanphamCount" class="text-xs text-slate-500 whitespace-nowrap">0 bản ghi</span>
                        <div class="ml-auto flex items-center gap-2">
                            <button id="btnProductManual" onclick="openProductManualDrawer()"
                                class="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-bold hover:bg-blue-700">Thêm
                                = tay</button>
                            <button id="btnProductExcel" onclick="triggerSimpleSheetExcelUpload('sanpham')"
                                class="px-3 py-2 rounded-lg bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700">Thêm
                                = Excel</button>
                            <button id="btnProductTemplate" onclick="downloadSimpleSheetTemplate('sanpham')"
                                class="px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700">Tải
                                Excel mẫu</button>
                            <button onclick="downloadFilteredSimpleSheetExcel('sanpham')"
                                class="px-3 py-2 rounded-lg bg-slate-700 text-white text-xs font-bold hover:bg-slate-800">Tải Excel theo lọc</button>
                        </div>
                    </div>
                    <div class="flex-1 min-h-0 overflow-hidden p-6 flex flex-col">
                        <div
                            class="hidden md:block flex-1 min-h-0 bg-white border border-slate-200 rounded-xl shadow-sm overflow-auto">
                            <table class="w-full text-left">
                                <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                                    <tr>
                                        <th data-sort-module="sanpham" data-sort-column="anh" onclick="toggleSimpleModuleSort('sanpham', 'anh')" class="w-[72px] cursor-pointer select-none">Ảnh <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanpham" data-sort-column="id" onclick="toggleSimpleModuleSort('sanpham', 'id')" class="w-[180px] cursor-pointer select-none">ID <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanpham" data-sort-column="ten_sp" onclick="toggleSimpleModuleSort('sanpham', 'ten_sp')" class="cursor-pointer select-none">Tên SP <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanpham" data-sort-column="ton_dau" onclick="toggleSimpleModuleSort('sanpham', 'ton_dau')" class="w-[120px] text-right cursor-pointer select-none">Tồn đầu <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanpham" data-sort-column="nhap" onclick="toggleSimpleModuleSort('sanpham', 'nhap')" class="w-[110px] text-right cursor-pointer select-none">Nhập <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanpham" data-sort-column="xuat" onclick="toggleSimpleModuleSort('sanpham', 'xuat')" class="w-[110px] text-right cursor-pointer select-none">Xuất <span data-sort-indicator></span></th>
                                        <th data-sort-module="sanpham" data-sort-column="ton_cuoi" onclick="toggleSimpleModuleSort('sanpham', 'ton_cuoi')" class="w-[130px] text-right cursor-pointer select-none">Tồn cuối <span data-sort-indicator></span></th>
                                    </tr>
                                </thead>
                                <tbody id="sanphamTableBody"></tbody>
                            </table>
                        </div>
                        <div id="sanphamMobileCards" class="md:hidden flex-1 min-h-0 overflow-auto space-y-3"></div>
                        <div id="sanphamPagination"></div>
                    </div>
                </div>
    </template>
</body>
</html>
